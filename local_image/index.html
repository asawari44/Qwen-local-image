<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen Image — Local Studio</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e9edf5;background:#10131a;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:50px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{margin:0;font-size:28px}p{color:#a4aec0;line-height:1.6}.badge{font-size:13px;color:#9cdbb7;background:#20352b;padding:8px 12px;border-radius:20px}.layout{display:grid;grid-template-columns:360px 1fr;gap:24px}.panel{background:#191e29;border:1px solid #303746;border-radius:16px;padding:24px}label{display:block;margin:0 0 8px;font-size:14px}textarea,input,select{width:100%;background:#10151f;color:inherit;border:1px solid #414b60;border-radius:8px;padding:12px;font:inherit}textarea{resize:vertical;min-height:160px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}button,.download{display:inline-block;background:#b9ccff;color:#142143;border:0;border-radius:8px;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}button{width:100%}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}#status{min-height:48px;font-size:14px;margin-bottom:0}#preview{width:100%;height:auto;border-radius:10px;display:block}#empty{display:grid;place-items:center;min-height:360px;color:#8794aa;text-align:center}.image-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}#metrics{font-size:13px;color:#a4aec0}[hidden]{display:none!important}@media(max-width:760px){main{margin-top:24px}.layout{grid-template-columns:1fr}header{align-items:flex-start;gap:16px}.panel{padding:18px}}
progress{width:100%;accent-color:#b9ccff;height:12px}#log-panel{margin-top:24px}#log-panel summary{cursor:pointer;font-weight:600}#logs{max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#10151f;padding:16px;border-radius:8px;font-size:12px;line-height:1.6}#log-state{font-size:13px;color:#a4aec0}</style>
<main>
<header><div><h1>Qwen Image</h1><p>Your local image studio · Qwen-Image-2512</p></div><span class="badge" id="health">Connecting…</span></header>
<div class="layout"><section class="panel">
<form id="form"><label for="prompt">Describe your image</label><textarea id="prompt" required maxlength="4000" placeholder="A red cabin beside a misty lake at sunrise…"></textarea>
<div class="row"><div><label for="size">Size</label><select id="size"><option value="768">768 × 768</option><option value="512">512 × 512</option><option value="1024">1024 × 1024</option></select></div><div><label for="steps">Steps</label><input id="steps" type="number" min="1" max="50" value="30" required></div></div>
<label for="seed">Seed</label><input id="seed" type="number" min="0" max="2147483647" value="42" required>
<p>Images are generated on your Mac and saved locally. The first tested 768 × 768 image took about 90 seconds.</p>
<button id="generate" disabled>Generate image</button><progress id="progress" value="0" max="30" hidden aria-label="Denoising steps"></progress><p id="status" role="status" aria-live="polite">Checking model readiness…</p></form>
</section><section class="panel" aria-label="Generated image"><div id="empty">Your image will appear here.</div><img id="preview" hidden alt=""><div class="image-footer"><span id="metrics"></span><a id="download" class="download" hidden>Download PNG</a></div></section></div>
<details class="panel" id="log-panel" open><summary>Model &amp; server logs</summary><p id="log-state">Connecting to logs…</p><pre id="logs" tabindex="0" aria-label="Recent server logs"></pre></details></main>
<script>
const $=id=>document.getElementById(id);let busy=false,ready=false;
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function request(url,options){const res=await fetch(url,options);const body=await res.json();if(!res.ok)throw new Error(typeof body.detail==='string'?body.detail:`Request failed (${res.status})`);return body;}
async function health(){try{const res=await fetch('/health');const data=await res.json();ready=res.ok;$('health').textContent=ready?'Model ready':data.status==='failed'?'Model unavailable':'Loading model…';if(!busy)$('status').textContent=ready?'Ready for your prompt.':'Waiting for the model to load…';}catch(e){ready=false;$('health').textContent='Server offline';if(!busy)$('status').textContent='Cannot reach the server. Start it and reload this page.';}$('generate').disabled=busy||!ready;}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy||!ready)return;busy=true;$('generate').disabled=true;$('generate').textContent='Generating…';$('status').textContent='Submitting…';try{const size=Number($('size').value);const prompt=$('prompt').value.trim();if(!prompt)throw new Error('Please enter a prompt.');const job=await request('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,width:size,height:size,steps:Number($('steps').value),seed:Number($('seed').value)})});sessionStorage.setItem('qwen-last-job',job.id);await follow(job.id,prompt);}catch(e){$('status').textContent=e.message;}finally{busy=false;$('generate').textContent='Generate image';$('generate').disabled=!ready;}});
async function follow(id,prompt='Generated image'){while(true){const job=await request('/jobs/'+id);$('progress').hidden=false;$('progress').max=job.parameters.steps;$('progress').value=job.step||0;if(job.status==='failed')throw new Error(job.error||'Generation failed.');if(job.status==='completed'){const url='/jobs/'+id+'/image';$('preview').src=url;$('preview').alt=prompt;$('preview').hidden=false;$('empty').hidden=true;$('download').href=url;$('download').download='qwen-'+id+'.png';$('download').hidden=false;$('metrics').textContent=job.elapsed_seconds+' seconds · '+job.parameters.width+' × '+job.parameters.height;$('status').textContent='Done. Your image is saved locally.';return;}$('status').textContent=job.status==='queued'?'Queued — waiting for the image worker…':(job.phase==='encoding'?'Encoding prompt…':job.phase==='decoding'?'Decoding image…':job.phase==='saving'?'Saving image…':'Step '+(job.step||0)+' / '+job.parameters.steps)+' · '+Math.round(Date.now()/1000-job.started_at)+'s';await pause(1500);}}
async function refreshLogs(){try{const data=await request('/logs');const box=$('logs');const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;box.textContent=data.lines.join('\n');if(atBottom)box.scrollTop=box.scrollHeight;$('log-state').textContent='Live · latest 120 lines · refreshes every 2 seconds';}catch(e){$('log-state').textContent='Logs unavailable — reconnecting…';}}
async function init(){refreshLogs();setInterval(refreshLogs,2000);await health();const last=sessionStorage.getItem('qwen-last-job');if(last){busy=true;$('generate').disabled=true;try{await follow(last);}catch(e){sessionStorage.removeItem('qwen-last-job');$('status').textContent=e.message;}finally{busy=false;$('generate').disabled=!ready;}}setInterval(health,10000);}init();
</script>
</html>
